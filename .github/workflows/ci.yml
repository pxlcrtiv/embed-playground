name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip install -e .
      - name: Unit tests (offline, deterministic)
        run: python -m pytest tests/ -q
      - name: Smoke — bundled corpus + golden outputs
        run: |
          embed-playground corpus | grep -q "docs: 36"
          embed-playground search "flash loan mechanics" | grep -q "d02"
          embed-playground eval --tier lexical | grep -q "recall@5: 75.0%"
          embed-playground compare "flash loan" | grep -qi "lexical"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff lint
        run: |
          pip install ruff
          ruff check embed_playground tests scripts --output-format=github